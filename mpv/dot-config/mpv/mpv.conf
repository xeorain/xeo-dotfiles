# User configuration for mpv.
#
# See /usr/share/doc/mpv/mpv.conf for a complete reference.
#
# Copyright (c) 2026 Jerry Xeo

vo=gpu-next
hwdec=auto
# The 'fast' profile prioritize maximum performance over visual enhancement,
# using lighter algorithm instead of heavy, high-quality rendering features,
# which is usually used for low-end devices to reduce processor usage and smooth
# playback.
# Use the 'fast' profile unless there are special requirements.
profile=fast

# Cache data in RAM to smooth seek backward/forward, which is especially useful
# for low-speed disks.
cache=yes
demuxer-max-bytes=2048MiB
demuxer-max-back-bytes=1024MiB

# Allow per-file/per-directory settings.
# * To apply a specific configuration to a single media file (e.g., test.mp4),
#   add desired settings to a <filename>.conf (e.g., test.mp4.conf) file in the
#   same directory where the media file resides.
# * To apply a specific configuration to all media files in a directory, add
#   desired settings to a mpv.conf file in that directory.
use-filedir-conf=yes

# Directory for saving screenshots
screenshot-directory="~/Pictures/Screenshots/mpv"

# Disable the built-in OSC (On-Screen Controller) and OSD (On-Screen Display)
# progress bar to use a custom theme plugin.
osc=no
osd-bar=no
# Text foreground color
osd-color="#a1b0b8"

# Settings for watch-later list
watch-later-directory="~/.local/state/mpv/watch_later"
watch-later-options-remove=sub-pos
watch-later-options-remove=osd-margin-y
