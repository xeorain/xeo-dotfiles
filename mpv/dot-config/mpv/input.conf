## Default keybindings cheat sheet
# o, OSD, on screen display progress bar
# O, toggle OSD
# i, media information
# I, toggle media information
# S, take a screenshot in orginal resolution without subtitles

. frame-step       # one frame forward and pause
, frame-back-step  # one frame backward and pause

h seek -5
l seek 5

f seek 30
b seek -30
F seek 300
B seek -300

c add chapter 1
C add chapter -1

s cycle sub-visibility
j add sub-scale -0.1
k add sub-scale 0.1
J add sub-delay -0.1
K add sub-delay 0.1

g seek 0 absolute-percent
G seek 100 absolute-percent

L cycle-values loop-file "inf" "no"  # toggle single file looping

ctrl+p show-text "${playlist}" 5000
ctrl+s playlist-shuffle; show-text "${playlist}" 5000
ctrl+u playlist-unshuffle; show-text "${playlist}" 5000
p playlist_prev; show-text ${playlist} 1100
n playlist_next; show-text ${playlist} 1100

q quit

m cycle mute
- add volume -1
= add volume 1

# Video flipping
v vf toggle vflip
V vf toggle hflip

# Video rotation
r cycle_values video-rotate "90" "180" "270" "0"  # clockwise
R cycle_values video-rotate "270" "180" "90" "0"  # counter-clockwise

# Video zooming
Alt+= add video-zoom 0.1
Alt+- add video-zoom -0.1
Alt++ add video-zoom 0.01
Alt+_ add video-zoom -0.01

z set video-zoom 0; set video-pan-x 0; set video-pan-y 0
Alt+h add video-pan-x 0.1
Alt+j add video-pan-y -0.1
Alt+k add video-pan-y 0.1
Alt+l add video-pan-x -0.1

Alt+H add video-pan-x 0.01
Alt+J add video-pan-y -0.01
Alt+K add video-pan-y 0.01
Alt+L add video-pan-x -0.01

# Speed (default)
[ multiply speed 1/1.1
] multiply speed 1.1
{ multiply speed 1/1.25
} multiply speed 1.25
BS set speed 1.0  ## Backspace

# Ignore mouse wheel
#WHEEL_UP    ignore
#WHEEL_DOWN  ignore
#WHEEL_LEFT  ignore
#WHEEL_RIGHT ignore

# Ignore arrow
#RIGHT ignore
#LEFT  ignore
#UP    ignore
#DOWN  ignore
#Shift+RIGHT ignore
#Shift+LEFT  ignore
#Shift+UP    ignore
#Shift+DOWN  ignore

# Ignore other keys
x      ignore
w      ignore
e      ignore
t      ignore
u      ignore
W      ignore
Z      ignore
ctrl+w ignore
ctrl+c ignore
!      ignore
@      ignore

# ModernZ ineractive menu
Ctrl+m script-binding select/select-playlist
Ctrl+M script-binding select/menu
