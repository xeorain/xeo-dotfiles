# Input bindings for foot.
#
# foot v1.26.0+ is required to support switching between dark and light themes
# on the fly.
#
# Copyright (c) 2026 Jerry Xeo

[key-bindings]
## Theme switch
color-theme-switch-dark=Control+Shift+F9
color-theme-switch-light=Control+Shift+F10

## Zooming
font-decrease=Control+minus
font-increase=Control+equal
font-increase=Control+Shift+equal
font-reset=Control+0
# Support NumLock keys.
font-decrease=Control+KP_Subtract
font-increase=Control+KP_Add

## Scrolling
scrollback-up-line=Control+Shift+Up
scrollback-down-line=Control+Shift+Down
scrollback-up-page=Control+Shift+Page_Up
scrollback-down-page=Control+Shift+Page_Down
scrollback-up-half-page=Control+Alt+Page_Up
scrollback-down-half-page=Control+Alt+Page_Down
scrollback-home=Control+Shift+Home
scrollback-end=Control+Shift+End

## URL handling
# Open URL in default browser.
show-urls-launch=Control+Shift+e
# Yank (copy) the URL.
show-urls-copy=Control+Shift+y

## Search mode
# Start search mode
search-start=Control+Shift+slash

# bindings in search mode
[search-bindings]

find-prev=Control+p
find-next=Control+n
extend-char=Control+Shift+l
extend-backward-char=Control+Shift+h
extend-line-up=Control+Shift+k
extend-line-down=Control+Shift+j
commit=Return

