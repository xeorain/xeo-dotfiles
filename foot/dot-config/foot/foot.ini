# Main user configuration for foot.
#
# foot v1.26.0+ is required to support switching between dark and light themes
# on the fly.
#
# Copyright (c) 2026 Jerry Xeo

include=~/.config/foot/bindings.ini
include=~/.config/foot/current-theme-dark.ini
include=~/.config/foot/current-theme-light.ini

[main]
# Disallow applications to change terminal title at runtime.
#locked-title=yes

## Fonts
# Aporetic (https://github.com/apkd/aporetic)
font=Aporetic Sans Mono:weight=medium:pixelsize=12, Monospace:pixelsize=12, Symbols Nerd Font Mono:pixelsize=12
font-italic=Aporetic Sans Mono:slant=italic:weight=medium:pixelsize=12, Monospace:slant=italic:pixelsize=12, Symbols Nerd Font Mono:pixelsize=12
font-bold=Aporetic Sans Mono:weight=bold:pixelsize=12, Monospace:weight=bold:pixelsize=12, Symbols Nerd Font Mono:pixelsize=12
font-bold-italic=Aporetic Sans Mono:slant=italic:weight=bold:pixelsize=12, Monospace:slant=italic:weight=bold:pixelsize=12, Symbols Nerd Font Mono:pixelsize=12

# Iosevka Term font custom variant
#font=Iosevka Term:weight=medium:pixelsize=12:fontfeatures=ss11:fontfeatures=cv10=24:fontfeatures=cv41=14:fontfeatures=cv52=12:fontfeatures=cv59=4, Monospace:pixelsize=12, Symbols Nerd Font Mono:pixelsize=12
#font-italic=Iosevka Term:slant=italic:weight=medium:pixelsize=12:fontfeatures=ss11:fontfeatures=cv10=6:fontfeatures=cv41=14:fontfeatures=cv52=12:fontfeatures=cv59=4, Monospace:slant=italic:pixelsize=12, Symbols Nerd Font Mono:pixelsize=12

# Iosevka Term SS08
#font=Iosevka Term SS08:weight=medium:pixelsize=12, Monospace:pixelsize=12, Symbols Nerd Font Mono:pixelsize=12
#font-italic=Iosevka Term SS08:slant=italic:weight=medium:pixelsize=12, Monospace:slant=italic:pixelsize=12, Symbols Nerd Font Mono:pixelsize=12

[scrollback]
# The number of scrollback lines is rounded up to nearest power of 2.
# See https://wiki.gentoo.org/wiki/Foot.
lines=16384
indicator-format=percentage

# vim:ft=confini:fileencoding=utf-8
