# --- Fonts ----------------------------------------------------------------{{{
# Aporetic (https://github.com/apkd/aporetic)
#font_family      family='Aporetic Sans Mono' style=Medium
#bold_font        auto
#italic_font      family='Aporetic Sans Mono' style='Medium Italic'
#bold_italic_font auto

# Iosveka Term SS08 (favored on MacBook Air because of its slanderness)
font_family      Iosevka-Term-SS08-Medium
italic_font      Iosevka-Term-SS08-Medium-Italic
bold_font        Iosevka-Term-SS08-Bold
bold_italic_font auto

# Iosevka Term custom variant (S11 X Window style with tweaks)
#font_family      family='Iosevka Term' style='Medium' features='+ss11 +calt +cv10=24 +cv41=14 +cv52=12 +cv59=4'
#bold_font        family='Iosevka Term' style='Bold' features='+ss11 +calt +cv10=24 +cv41=14 +cv52=12 +cv59=4'
#italic_font      family='Iosevka Term' style='Medium Italic' features='+ss11 +calt +cv10=24 +cv41=14 +cv52=12 +cv59=4'
#bold_italic_font family='Iosevka Term' style='Bold Italic' features='+ss11 +calt +cv10=24 +cv41=14 +cv52=12 +cv59=4'

# CJK font fallback.
symbol_map U+4E00-U+9FFF,U+3400-U+4DBF PingFang SC

# Symbolic glyphs fallback:
# * IEC Power Symbols: U+23FB-U+23FE,U+2B58
# * Box Drawing: U+2500-U+259F
# * Heavy Angle Brackets: U+276C-U+2771
# * Pomicons: U+E000-U+E00A
# * Powerline Symbols: U+E0A0-U+E0A2,U+E0B0-U+E0B3
# * Powerline Extra Symbols: U+E0A3,U+E0B4-U+E0C8,U+E0CA,U+E0CC-U+E0D4
# * Seti-UI + Custom: U+E5FA-U+E6AC
# * Font Awesome Extension: U+E200-U+E2A9
# * Weather: U+E300-U+E3E3
# * Devicons: U+E700-U+E7C5
# * Codicons: U+EA60-U+EBEB
# * Font Awesome: U+F000-U+F2E0
# * Font Logos: U+F300-U+F32F
# * Octicons: U+F400-U+F532,U+2665,U+26A1
# * Material Design Icons: U+F0001-U+F1AF0
symbol_map U+E000-U+E00A,U+EA60-U+EBEB,U+E0A0-U+E0C8,U+E0CA,U+E0CC-U+E0D7,U+E200-U+E2A9,U+E300-U+E3E3,U+E5FA-U+E6B1,U+E700-U+E7C5,U+ED00-U+EFC1,U+F000-U+F2FF,U+F000-U+F2E0,U+F300-U+F372,U+F400-U+F533,U+F0001-U+F1AF0 Symbols Nerd Font Mono

# Font size (in pt).
# A proper font size depends on the fonts and the monitor specification, so
# adjust it accordingly.
# 14pt used for MacBook Air 13-inch display (227 DPI).
font_size 14

# Do not render ligatures for the text under the cursor.
disable_ligatures cursor

# Thicken fonts (useful for a light background theme); comment out below if
# the font in use looks good.
#text_composition_strategy legacy
# }}}

# --- Key bindings ---------------------------------------------------------{{{
# Use 'option' key as Alt on macOS.
macos_option_as_alt yes

# Reload configuration. (press fn+f5 to produce F5 on MacBook)
map cmd+shift+f5 load_config_file

# Launch theme manager. (press fn+f9 to produce F9 on MacBook)
map cmd+shift+f9 combine : kitten themes --config-file-name=theme-loader.conf : load_config_file

## Layout
# Split the window in automatic direction.
map cmd+shift+enter launch --location=split --cwd=current
# Split the window to the bottom (horizontally).
map cmd+shift+minus launch --location=hsplit --cwd=current
# Split the window to the right (vertically).
map cmd+shift+backslash launch --location=vsplit --cwd=current
map cmd+shift+z toggle_layout stack

## Tab
# Add command+option+w to close a tab, while keeping the default ctrl+shift+q.
# The macOS alternative default command+w is now rebound to close a split
# window.
# NOTE: Do not bind cmd+shift+w at it is a macOS system-level keybind.
#map ctrl+shift+q no_op
map cmd+alt+w close_tab
map cmd+shift+comma prev_tab
map cmd+shift+period next_tab
map cmd+shift+comma move_tab_backward
map cmd+shift+period move_tab_forward

## Window
# Unbind the macOS alternative default commadn+shift+d, and use cmd+w instead to
# close a split window.
map cmd+shift+d no_op
map cmd+w close_window
map cmd+alt+left neighboring_window left
map cmd+alt+right neighboring_window right
map cmd+alt+up neighboring_window up
map cmd+alt+down neighboring_window down
map cmd+alt+shift+left move_window left
map cmd+alt+shift+right move_window right
map cmd+alt+shift+up move_window up
map cmd+alt+shift+down move_window down

## Scrolling (use defaults)
map cmd+shift+up scroll_line_up
map cmd+shift+down scroll_line_down
map cmd+page_up scroll_page_up
map cmd+page_down scroll_page_down
map cmd++home scroll_home
map cmd+end scroll_end
# Scroll half page by using `remote_control scroll-window`. See:
# * https://sw.kovidgoyal.net/kitty/actions/#action-scroll_page_down
# * https://sw.kovidgoyal.net/kitty/remote-control/#kitten-scroll-window
map alt+page_up remote_control scroll-window 0.5p-
map alt+page_down remote_control scroll-window 0.5p
# Jump to previous/next prompt, overriding the default ctrl+shift+z and
# ctrl+shift+x.
map ctrl+shift+x no_op
map ctrl+shift+z no_op
map --allow-fallback=shifted,ascii cmd+up scroll_to_prompt -1
map --allow-fallback=shifted,ascii cmd+down scroll_to_prompt 1

# Open the terminal scrollback history in a configured pager (default:
# ctrl+shift+h).
map cmd+shift+s show_scrollback

## Zooming (overriding the default step 2.0)
map cmd+minus change_font_size all -1.0
map cmd+equal change_font_size all +1.0
map cmd+shift+equal change_font_size all +1.0
map cmd+0 change_font_size all 0
# Support NumLock keys.
map cmd+kp_add change_font_size all +1.0
map cmd+kp_subtract change_font_size all -1.0

## URL handling
# Unbind command+shift+/ which is mapped on macOS to open kitty official site.
map cmd+shift+/ no_op
# Open a URL in browser.
map cmd+shift+e open_url_with_hints
# Copy a URL to clipboard.
map cmd+shift+y kitten hints --type url --program @
# }}}

