# --- Fonts ----------------------------------------------------------------{{{
# Aporetic (https://github.com/apkd/aporetic)
font_family      family='Aporetic Sans Mono' style=Medium
bold_font        auto
italic_font      family='Aporetic Sans Mono' style='Medium Italic'
bold_italic_font auto

# Iosveka Term SS08 (favored on MacBook Air because of its slanderness)
#font_family      Iosevka-Term-SS08-Medium
#italic_font      Iosevka-Term-SS08-Medium-Italic
#bold_font        Iosevka-Term-Bold
#bold_italic_font auto

# Iosevka Term custom variant (S11 X Window style with minor tweaks)
# font_family      family='Iosevka Term' style='Medium' features='+ss11 +calt +cv10=24 +cv41=14 +cv52=12 +cv59=4'
# bold_font        family='Iosevka Term' style='Bold' features='+ss11 +calt +cv10=24 +cv41=14 +cv52=12 +cv59=4'
# italic_font      family='Iosevka Term' style='Medium Italic' features='+ss11 +calt +cv10=24 +cv41=14 +cv52=12 +cv59=4'
# bold_italic_font family='Iosevka Term' style='Bold Italic' features='+ss11 +calt +cv10=24 +cv41=14 +cv52=12 +cv59=4'

# CJK font fallback.
symbol_map U+4E00-U+9FFF,U+3400-U+4DBF Noto Sans Mono CJK SC

# Symbolic glyphs fallback:
# * IEC Power Symbols: U+23FB-U+23FE,U+2B58
# * Box Drawing: U+2500-U+259F
# * Heavy Angle Brackets: U+276C-U+2771
# * Pomicons: U+E000-U+E00A
# * Powerline Symbols: U+E0A0-U+E0A2,U+E0B0-U+E0B3
# * Powerline Extra Symbols: U+E0A3,U+E0B4-U+E0C8,U+E0CA,U+E0CC-U+E0D4
# * Seti-UI + Custom: U+E5FA-U+E6AC
# * Font Awesome Extension: U+E200-U+E2A9
# * Weather: U+E300-U+E3E3
# * Devicons: U+E700-U+E7C5
# * Codicons: U+EA60-U+EBEB
# * Font Awesome: U+F000-U+F2E0
# * Font Logos: U+F300-U+F32F
# * Octicons: U+F400-U+F532,U+2665,U+26A1
# * Material Design Icons: U+F0001-U+F1AF0
symbol_map U+E000-U+E00A,U+EA60-U+EBEB,U+E0A0-U+E0C8,U+E0CA,U+E0CC-U+E0D7,U+E200-U+E2A9,U+E300-U+E3E3,U+E5FA-U+E6B1,U+E700-U+E7C5,U+ED00-U+EFC1,U+F000-U+F2FF,U+F000-U+F2E0,U+F300-U+F372,U+F400-U+F533,U+F0001-U+F1AF0 Symbols Nerd Font Mono

# Font size (in pt).
# A proper font size depends on the fonts and the monitor specification, so
# adjust it accordingly.
# 9pt used for 27-inch 4k display (163 DPI) with 200% scaling.
font_size 9

# Do not render ligatures for the text under the cursor.
disable_ligatures cursor

# Thicken fonts (useful for a light background theme); comment out below if
# the font in use looks good.
text_composition_strategy legacy
# }}}

# --- Key bindings ---------------------------------------------------------{{{
# Launch theme manager.
map ctrl+shift+f9 combine : kitten themes --config-file-name=theme-loader.conf : load_config_file

## Layout
# Split the window in automatic direction.
map ctrl+shift+enter launch --location=split --cwd=current
# Split the window to the bottom (horizontally).
map ctrl+shift+minus launch --location=hsplit --cwd=current
# Split the window to the right (vertically).
map ctrl+shift+backslash launch --location=vsplit --cwd=current
# Mimic maximizing a split window by switching to stack layout.
map ctrl+shift+z toggle_layout stack

## Tab
# Add ctrl+alt+w to close a tab, while keeping the default ctrl+shift+q.
#map ctrl+shift+q no_op
map ctrl+alt+w close_tab
map ctrl+shift+[ prev_tab
map ctrl+shift+] next_tab
map ctrl+shift+comma move_tab_backward
map ctrl+shift+period move_tab_forward

## Window
# Use ctrl+shift+w to close a split window (already default).
#map ctrl+shift+w close_window
map ctrl+alt+left neighboring_window left
map ctrl+alt+right neighboring_window right
map ctrl+alt+up neighboring_window up
map ctrl+alt+down neighboring_window down
map ctrl+alt+shift+left move_window left
map ctrl+alt+shift+right move_window right
map ctrl+alt+shift+up move_window up
map ctrl+alt+shift+down move_window down

## Scrolling
map ctrl+shift+up scroll_line_up
map ctrl+shift+down scroll_line_down
map ctrl+shift+page_up scroll_page_up
map ctrl+shift+page_down scroll_page_down
map ctrl+shift+home scroll_home
map ctrl+shift+end scroll_end
# Scroll half page by using `remote_control scroll-window`. See:
# * https://sw.kovidgoyal.net/kitty/actions/#action-scroll_page_down
# * https://sw.kovidgoyal.net/kitty/remote-control/#kitten-scroll-window
map alt+shift+page_up remote_control scroll-window 0.5p-
map alt+shift+page_down remote_control scroll-window 0.5p
# Jump to previous/next prompt, overriding the default ctrl+shift+z (remapped
# to maximize a split window) and ctrl+shift+x.
map ctrl+shift+x no_op
map --allow-fallback=shifted,ascii alt+shift+up scroll_to_prompt -1
map --allow-fallback=shifted,ascii alt+shift+down scroll_to_prompt 1

# Open the terminal scrollback history in a configured pager, overriding the
# default ctrl+shift+h.
map ctrl+shift+s show_scrollback

## Zooming
map ctrl+minus change_font_size all -1.0
map ctrl+equal change_font_size all +1.0
map ctrl+shift+equal change_font_size all +1.0
map ctrl+0 change_font_size all 0
# Support NumLock keys.
map ctrl+kp_subtract change_font_size all -1.0
map ctrl+kp_add change_font_size all +1.0

## URL handling
# Open a URL in browser (already default).
#map ctrl+shift+e open_url_with_hints
# Copy a URL to clipboard.
map ctrl+shift+y kitten hints --type url --program @
# }}}

# vim:ft=kitty:fileencoding=utf-8:foldmethod=marker
