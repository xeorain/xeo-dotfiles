# Main user configuration for kitty.
#
# Copyright (c) 2026 Jerry Xeo

# --- UI -------------------------------------------------------------------{{{
enable_audio_bell no
#dynamic_background_opacity yes

## Cursor
cursor_blink_interval 0

## Layout
enabled_layouts splits,stack

## Tab
tab_bar_edge bottom
tab_bar_style powerline
tab_title_template "{title}{fmt.bold}{'  ' if num_windows > 1 and layout_name == 'stack' else ''}"

## Window
window_border_width 0.1
# }}}

# --- Misc. ----------------------------------------------------------------{{{
allow_remote_control yes
copy_on_select yes

scrollback_lines 10000
# NOTE: Comment it out or change it to your own pager if you don't use my Neovim
# configuration.
scrollback_pager nvim -c "lua require('util').colorize()"
# }}}

# --- Performance ----------------------------------------------------------{{{
# Decrease it properly for high refresh rate display at the cost of relatively
# higher CPU usage.
# See https://sw.kovidgoyal.net/kitty/conf/#opt-kitty.repaint_delay
repaint_delay 20

# Enable it to achieve real high refresh rate.
#sync_to_monitor no
# }}}

# --- OS-specific configuration --------------------------------------------{{{
# INFO: KITTY_OS is a special variable only visible in kitty configuration. Its
# value can be either 'linux' or 'macos' depending on the platform it is running.
include ${KITTY_OS}.conf
# }}}

# --- Theme ----------------------------------------------------------------{{{
# Load color theme.
# NOTE: To switch to another theme, either run `kitty +kitten themes
# --config-file-name=theme-loader.conf` or press Ctrl+Shift+F9 to to launch the
# kitty theme manager, and apply the selected theme by choosing the "Modify
# theme-loader.conf" option.
include theme-loader.conf

# Prevent the cursor color set by a kitty theme from overriding the cursor color
# set by a Vim color scheme.
cursor none
# }}}

# vim:ft=kitty:fileencoding=utf-8:foldmethod=marker
