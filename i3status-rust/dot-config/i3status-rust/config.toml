### A custom idle inhibition state indicator ###
# Requires:   xeo-inhibit-idle, ~/.local/libexec/xeo-utils-desktop/bar-signal
[[block]]
block = "custom"
format = " $text.pango-str() "
hide_when_empty = true
interval = 60
if_command = "command -v xeo-inhibit-idle"
command = ''' mins=$(xeo-inhibit-idle) && printf '<span fallback="true">󰒳</span> %s' "${mins}" || printf '<span fallback="true">󰒲</span>' '''
shell = "sh"
signal = 2
[[block.click]]
button = "left"
cmd = 'xeo-inhibit-idle interactive && ~/.local/libexec/xeo-utils-desktop/bar-signal i3status-rs 2'
[[block.click]]
button = "middle"
cmd = 'xeo-inhibit-idle off && ~/.local/libexec/xeo-utils-desktop/bar-signal i3status-rs 2'

### System menu ###
#
# Mouse Operations:
#   - Left-click activate the menu, wheel up/down to cycle menu items
#   - Left-click on the menu item to run it, optionally left-click again to
#     confirm
#   - Right-click to deactivate the menu
#
# Requires:   sway, swaylock
[[block]]
block = "menu"
text = " <span fallback='true'></span>"
if_command = 'command -v swaymsg && command -v swaylock'
[[block.items]]
display = " -&gt;   Lock   &lt;-"
cmd = "exec swaylock"
[[block.items]]
display = " -&gt;   Logout   &lt;-"
cmd = "swaymsg exit"
[[block.items]]
display = " -&gt;   Sleep   &lt;-"
cmd = "systemctl suspend"
[[block.items]]
display = " -&gt; Power Off &lt;-"
cmd = "systemctl poweroff"
confirm_msg = "Are you sure to power off?"
[[block.items]]
display = " -&gt;  Reboot   &lt;-"
cmd = "systemctl reboot"
confirm_msg = "Are you sure to reboot?"
