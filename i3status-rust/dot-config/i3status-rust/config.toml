# User configuration for i3status-rust
#
# See https://docs.rs/i3status-rs/latest/i3status_rs/blocks/index.html for
# reference.
#
# Copyright (c) 2026 Jerry Xeo

# For Nerd Fonts, the spaces around an icon are rendered as ghost dots. The
# font fallback Pango markup must be used to enclose the icon so that
# swaybar, which uses the Pango library for text rendering, can handle the icon
# glyphs separately from the surroundings.
#
# It probably boils down to how Pango renders characters in Private Use Area
# (PUA). Pango attaches a space before an icon to the icon context, and looks
# up the glyph for the space in the given icon font. If the glyph is missing in
# the font, Pango draws a missing-glyph marker (hex box or tiny dot) instead of
# looking for the glyph in the fonts given by the fallback list, resulting in a
# pre-icon dot. The post-icon dot seems to be a virtual boundary added by Pango
# to prevent the icon overlapping the following characters. If the virtual
# boundary glyph is missing in the icon font, Pango draws a missing-glyph
# marker as well.
#
# See https://github.com/greshake/i3status-rust/issues/2260
#
# NOTE: The 'icons_format' key only works with built-in supported icons. For
# icons embedded in a format text, the same Pango markup must surround each of
# them.
icons_format = "<span fallback='true'>{icon}</span>"

[theme]
theme = "xeorain"
[theme.overrides]
start_separator = ""

# All integrated icons can be found at
# https://github.com/greshake/i3status-rust/tree/master/files/icons
[icons]
icons = "awesome7pro"

