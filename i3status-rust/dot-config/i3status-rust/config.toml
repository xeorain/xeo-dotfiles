cmd = ''' pkill -U "${USER}" -x pw-record '''

### A custom clipboard status block ###
#
# Show a clipboard icon followed by the number of clipboard history items.
# The number is displayed in engineering notation where large numbers have a
# suffix like K, M, G, etc.
#
# cliphist uses bbolt database to store clipboard history. The combination of
# using a dedicated inspection command `bbolt`, `grep` and `cut` is
# significantly faster than `cliphist list | wc -l`, especially for large
# database. This is because `cliphist list` must open the database, iterate
# through every entry, format each one into a string (ID + Preview text), and
# then dump that massive text stream to the pipe for `wl -l` to count the number
# of lines.
#
# Requires:   cliphist (indicator-format=percentage),
#             bbolt (provided by the golang-etcd-bbolt package on Fedora)
# Requires:   ~/.local/libexec/xeo-utils-desktop/cliphist-helper
[[block]]
block = "custom"
format = " <span fallback='true'>󰨸</span> $text.pango-str() |"
command = '''
cnt="$(bbolt stats ~/.cache/cliphist/db | grep -m1 'keys/value pairs' | cut -d' ' -f5)"
if [ "${cnt}" -ne 0 ]; then
  cnt="$(numfmt --to=si --format='%.1f' ${cnt} | sed 's/\.0//')"
else
  cnt=''
fi
printf '{"state":"Idle","text":"%s"}' "${cnt}"
'''
if_command = 'test -x "$HOME/.local/libexec/xeo-utils-desktop/cliphist-helper"'
interval = "once"
signal = 3
json = true
hide_when_empty = true
shell = "sh"
[[block.click]]
button = "left"
cmd = '~/.local/libexec/xeo-utils-desktop/cliphist-helper copy'
[[block.click]]
button = "right"
cmd = '~/.local/libexec/xeo-utils-desktop/cliphist-helper delete && ~/.local/libexec/xeo-utils-desktop/bar-signal i3status-rs 3'
[[block.click]]
button = "middle"
cmd = '~/.local/libexec/xeo-utils-desktop/cliphist-helper wipe && ~/.local/libexec/xeo-utils-desktop/bar-signal i3status-rs 3'

### Weather forecast ###
#
# When 'autolocate' is set to true, the weather block automatically queries
# location through the ipapi (https://ipapi.co) service at an time interval
# (in seconds) set by 'autolocate_interval'. The ipaip.co service has a daily
# limit of 1000 free requests. Once the limited is reached, the weather block
# will fall back to the static location set in 'block.service' table.
#
# NOTE: Although the 'autolocate_interval' is set to 1800 seconds—resulting in
# only 48 requests in total per day, it would be better to use a static
# location (which can be obtained with `curl ipinfo.io/loc`) for stationary
# devices such as a home or office PC, and is especially recommended for those
# living in countries where access to https://ipapi.co is restricted.
[[block]]
block = "weather"
interval = 1800 # weather query time interval
autolocate = false # prefer static location over auto location query
autolocate_interval = 1800 # auto location query time interval
format = " $icon $temp "
format_alt = " $icon $weather ($location) $temp, $wind m/s $direction"
[block.service]
name = "metno" # weather service
coordinates = [ "31.2222", "121.4581" ] # static location
forecast_hours = 6

### System uptime ###
[[block]]
block = "uptime"
interval = 3600
format = " $icon $uptime "
[block.icons_overrides]
uptime = ""

### Device usages ###
# Disk usage
[[block]]
block = "disk_space"
backend = "btrfs"
path = "/"
info_type = "used"
alert_unit = "GB"
interval = 60
warning = 100.0
alert = 50.0
format = " $icon {$percentage.eng(w:1) |}"
merge_with_next = true
[block.icons_overrides]
disk_drive = ""

# Memory usage
[[block]]
block = "memory"
format = " $icon {$mem_used_percents.eng(w:1) |}"
format_alt = " $icon_swap {$swap_used_percents.eng(w:1) |}"
merge_with_next = true
[block.icons_overrides]
memory_mem = ""
memory_swap = ""

# CPU usage
[[block]]
block = "cpu"
interval = 5
info_cpu = 30
warning_cpu = 70
critical_cpu = 90
format = " $icon $utilization "
[block.icons_overrides]
cpu = ""

### Device temperatures ###
# CPU temperature from the coretemp sensor module
[[block]]
block = "temperature"
interval = 5
format = " $icon $max "
chip = "coretemp-isa-0000"
merge_with_next = true
[block.theme_overrides]
good_fg = "#abb9b6"

# CPU socket temperature from the acpitz module
#
# Use the acpitz temperature to approximate CPU socket temperature as the Linux
# kernel has no direct support.
#
# NOTE: Uncomment this block if you don't use the nct6687 driver for fetching
#device temperatures.
#[[block]]
#block = "temperature"
#interval = 5
#format = " $icon $max "
#chip = "acpitz_0-acpi-0"
#merge_with_next = true
#[block.theme_overrides]
#good_fg = "#abb9b6"

# WARN: Do not use the following blocks if your computer motherboard does not
# have an nct6687-isa-* chip or you haven't got the device driver installed!
#
# The third-party nct6687 driver (https://github.com/Fred78290/nct6687d) is used
# access the Nuvoton NCT66xx Super I/O chip on motherboards (e.g., MSI B660M) to
# get finer-grained device temperatures
#
# CPU socket temperature from the nct6687 driver
[[block]]
block = "temperature"
interval = 5
format = " $icon $max "
format_alt = " CPU Socket $max "
chip = "nct6687-isa-*"
inputs = [ "CPU Socket" ]
merge_with_next = true
[block.theme_overrides]
good_fg = "#abb9b6"

# Accurate PCH temperature from the nct6687 driver
[[block]]
block = "temperature"
interval = 5
format = " $icon $max "
format_alt = " PCH $max "
chip = "nct6687-isa-*"
inputs = [ "PCH" ]
merge_with_next = true
[block.theme_overrides]
good_fg = "#abb9b6"

# NVME SSD temperature
[[block]]
block = "temperature"
interval = 5
format = " $icon $max "
chip = "nvme-pci-0100"
inputs = ["Composite", "Sensor 1", "Sensor 2"]
[block.theme_overrides]
good_fg = "#abb9b6"

