### Custom music block ###
# Use this custom block as the built-in music block doesn't distinguish between
# "paused" and "stopped" states.
#
# Mouse Operations:
#   - Left-click to toggle play/pause
#   - Right-click to stop playback
#   - Wheel up to seek forward
#   - Wheel down to seek backward
#
# Requires:   mpd, mpc, ~/.local/libexec/i3status-rust/check-mpd-status
[[block]]
block = "custom"
format = ' $text.pango-str() |'
interval = "once"
command = "~/.local/libexec/i3status-rust/check-mpd-status"
if_command = "test -x ~/.local/libexec/i3status-rust/check-mpd-status"
json = true
hide_when_empty = true
signal = 4
[[block.click]]
button = "left"
cmd = "mpc toggle"
[[block.click]]
button = "right"
cmd = "mpc stop"
[[block.click]]
button = "up"
cmd = "mpc seek +1"
[[block.click]]
button = "down"
cmd = "mpc seek -1"
[block.theme_overrides]
info_bg = "#005577" # dark cyan
info_fg = "#eeeeee"

### Scratchpad status ###
# Show the number of scratchpad windows
[[block]]
block = "scratchpad"
format = ' $icon$count.eng(range:1..) |'

### A custom screen recording indicator ###
[[block]]
block = "custom"
format = " $text.pango-str() |"
interval = "once"
command = '''
if /bin/kill -0 -- "$(cat "${XDG_RUNTIME_DIR:-/tmp}/xeo-screenrec-wlr-${EUID:-$(id -u)}-${XDG_SESSION_ID:-$(cat /proc/self/sessionid)}.pid")" >/dev/null 2>&1; then
  printf '<span fallback="true">󰄙</span>'
else
  printf ''
fi
'''
hide_when_empty = true
shell = "sh"
signal = 5
[block.theme_overrides]
idle_bg = "#7e56c2" # purple
idle_fg = "#eeeeee"
[[block.click]]
button = "middle"
cmd = ''' pkill -U "${USER}" -x wf-recorder '''

### A custom audio recording indicator ###
#
# Requires:   pipewire-utils
[[block]]
block = "custom"
format = " $text.pango-str() |"
interval = "once"
command = '''
if /bin/kill -0 -- "$(cat "${XDG_RUNTIME_DIR:-/tmp}/xeo-audiorec-${EUID:-$(id -u)}-${XDG_SESSION_ID:-$(cat /proc/self/sessionid)}.pid")" >/dev/null 2>&1; then
