format = " $icon $signal_strength "
format_alt = " $icon $device ($ssid): $ip "
inactive_format = " <span fallback='true'>󰖪</span> "
merge_with_next = true
[block.icons_overrides]
net_wireless = "󰖩"

# Bluetooth
[[block]]
