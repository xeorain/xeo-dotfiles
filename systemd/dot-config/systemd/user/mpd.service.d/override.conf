# A drop-in configuration file for overriding /usr/lib/systemd/user/mpd.service
# to automatically create necessary directories before starting the MPD.
#
# Relative paths set in ~/.config/mpd/mpd.conf:
#   * The playlists directory: ~/.config/mpd/.playlists
#   * The database file: ~/.cache/mpd/database
#   * The state file: ~/.local/state/mpd/state
#
# Copyright (c) 2026 Jerry Xeo

[Service]
ExecStartPre=/usr/bin/mkdir -p %h/Music/.playlists
# Create ~/.cache/mpd
CacheDirectory=mpd
# Create ~/.local/state/mpd
StateDirectory=mpd
