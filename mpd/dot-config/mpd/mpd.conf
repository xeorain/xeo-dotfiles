# User configuration for mpd.
#
# See `man mpd.conf(5)` for more information.
#
# Copyright (c) 2026 Jerry Xeo

# To prevent subdirectories from being imported into the media library, create a
# .mpdignore file in music_directory and add excluded subdirectory names to it.
music_directory "~/Music"
playlist_directory "~/Music/.playlists"

auto_update "yes"
restore_paused "yes"

db_file "~/.cache/mpd/mpd.db"
# Disable logging.
#log_file "~/.cache/mpd/mpd.log"
pid_file "~/.cache/mpd/mpd.pid"
state_file "~/.cache/mpd/mpdstate"

audio_output {
  type "pipewire"
  name "PipeWire Sound Server"
}

# Visualization
audio_output {
  type "fifo"
  name "Visualizer feed"
  path "/tmp/mpd.fifo"
  format "44100:16:2"
}
