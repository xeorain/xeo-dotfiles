# User configuration for mpd.
#
# See `man mpd.conf(5)` for more information.
#
# NOTE: ~/.config/systemd/user/mpd.service.d/override.conf, which is a systemd
# drop-in file overriding /usr/lib/systemd/user/mpd.service, is used to create
# missing XDG-compliant directories. Always start mpd via `systemctl --user
# start mpd.service` to avoid potential errors.
#
# Copyright (c) 2026 Jerry Xeo

# To prevent subdirectories from being imported into the media library, create a
# .mpdignore file in music_directory and add excluded subdirectory names to it.
music_directory "~/Music"
playlist_directory "~/Music/.playlists"

auto_update "yes"
restore_paused "yes"

# XDG-compliant file paths
db_file "~/.cache/mpd/mpd.db"
# Disable logging.
#log_file "~/.cache/mpd/mpd.log"
# No need to use pid file when managing mpd via systemd
#pid_file "~/.cache/mpd/mpd.pid"
state_file "~/.local/state/mpd/state"

audio_output {
  type "pipewire"
  name "PipeWire Sound Server"
}

# Visualization
audio_output {
  type "fifo"
  name "Visualizer feed"
  path "/tmp/mpd.fifo"
  format "44100:16:2"
}

# Disable wildmidi plugin
decoder {
  plugin "wildmidi"
  enabled "no"
}
