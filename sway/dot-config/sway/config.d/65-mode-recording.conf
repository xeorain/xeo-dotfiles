# Binding mode for recording screen and sound.
#
# Copyright (c) 2026 Jerry Xeo
#
# Requires:     foot,
#               ~/.local/libexec/sway/audiorec-helper (see it for more deps),
#               ~/.local/libexec/sway/screenrec-helper (see it for more deps)

set $cmd_audiorec $libexec_sway/audiorec-helper
set $mode_audio_recording '<span fallback="true">󰍬</span>  \
[<b>s</b>]tart [<b>k</b>]kill'

mode --pango_markup $mode_audio_recording {
    ## Launch // Audio Recorder ##
    $bindsym s mode default, exec $term_float -T "Xeo Audio Recorder" "$cmd_audiorec" -b $bar -s $sig_audiorec
    ## Action // Stop audio recording ##
    # NOTE: Use negative pid of audiorec-helper to kill the process group
    $bindsym k mode default, exec \
        PIDFILE="${XDG_RUNTIME_DIR:-/tmp}/sway-audiorec-helper-${EUID:-$(id -u)}-${XDG_SESSION_ID:-$(cat /proc/self/sessionid)}.pid" \
            && [ -f "$PIDFILE" ] && sed 's/^/-/' "$PIDFILE" | xargs kill --
    $bindsym Escape mode default
    $bindsym Return mode default
    $bindsym $mod+Shift+F10 mode default
}

## Launch // Audio Recording Mode ##
$bindsym $mod+Shift+F10 mode $mode_audio_recording
## Action // Toggle audio recording window visibility ##
$bindsym $mod+F10 exec swaymsg -t get_tree \
    | jq -e '.. | objects | select(.app_id? == "_floating_term" and .name? == "Xeo Audio Recorder" and .scratchpad_state? != "none")' >/dev/null \
    && swaymsg '[app_id="_floating_term" title="Xeo Audio Recorder"] scratchpad show' \
    || swaymsg '[app_id="_floating_term" title="Xeo Audio Recorder"] move scratchpad'

set $cmd_screenrec $libexec_sway/gsr-helper
set $mode_screen_recording '<span fallback="true">󰄙</span> \
[<b>o</b>]utput [<b>O</b>]utput (select) \
[<b>w</b>]indow [<b>W</b>]indow (select) \
[<b>G</b>]eometry \
[<b>k</b>]ill'

mode --pango_markup $mode_screen_recording {
    ## Launch // Screen Recorder ##
    # currently focused display output
    $bindsym o mode default, exec $term_float -T "Xeo Screen Recorder" "$cmd_screenrec" -b $bar -s $sig_screenrec ao
    # currently focused window
    $bindsym w mode default, exec $term_float -T "Xeo Screen Recorder" "$cmd_screenrec" -b $bar -s $sig_screenrec aw
    # manually select a display output
    $bindsym Shift+o mode default, exec $term_float -T "Xeo Screen Recorder" "$cmd_screenrec" -b $bar -s $sig_screenrec io
    # manually select a window
    $bindsym Shift+w mode default, exec $term_float  -T "Xeo Screen Recorder" "$cmd_screenrec" -b $bar -s $sig_screenrec iw
    # manually select a rectangular region
    $bindsym shift+g mode default, exec $term_float -T "Xeo Screen Recorder" "$cmd_screenrec" -b $bar -s $sig_screenrec ig
    ## Action // Stop screen recording ##
    # NOTE: Use negative pid of screenrec-helper to kill the process group
    $bindsym k mode default, exec \
        PIDFILE="${XDG_RUNTIME_DIR:-/tmp}/sway-gsr-helper-${EUID:-$(id -u)}-${XDG_SESSION_ID:-$(cat /proc/self/sessionid)}.pid" \
            && [ -f "$PIDFILE" ] && sed 's/^/-/' "$PIDFILE" | xargs kill --

    $bindsym Escape mode default
    $bindsym Return mode default
    $bindsym $mod+Shift+F9 mode default
}

## Launch // Audio Recording Mode ##
$bindsym $mod+Shift+F9 mode $mode_screen_recording

## Action // Toggle screen recording window visibility ##
$bindsym $mod+F9 exec swaymsg -t get_tree \
    | jq -e '.. | objects | select(.app_id? == "_floating_term" and .name? == "Xeo Screen Recorder" and .scratchpad_state? != "none")' >/dev/null \
    && swaymsg '[app_id="_floating_term" title="Xeo Screen Recorder"] scratchpad show' \
    || swaymsg '[app_id="_floating_term" title="Xeo Screen Recorder"] move scratchpad'

# vim:ft=swayconfig
