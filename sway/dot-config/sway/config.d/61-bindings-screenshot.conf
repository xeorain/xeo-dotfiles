# Key bindings for taking screenshots.
#
# Copyright (c) 2026 Jerry Xeo
#
# Requires:   satty, wl-clipboard,
#             ~/.local/libexec/sway/screenshot-helper (see it for more deps)

set $cmd_screenshot $libexec_sway/screenshot-helper

## Launch // Open xeo-screenhost to take a screenshot ##
$bindsym {
    # Capture focused display output.
    $mod+y exec '"$cmd_screenshot" ao - | satty --copy-command wl-copy --filename -'
    # Capture the all display outputs combined.
    $mod+Shift+y exec '"$cmd_screenshot" aa - | satty --copy-command wl-copy --filename -'
    # Capture focused window.
    $mod+Alt+y exec '"$cmd_screenshot" aw - | satty --copy-command wl-copy --filename -'
    # Capture a selected rectangular region.
    $mod+Ctrl+y exec '"$cmd_screenshot" ig  - | satty --copy-command wl-copy --filename -'
    ## Ditto, with Print key
    # Capture focused display output.
    Print exec '"$cmd_screenshot" ao - | satty --copy-command wl-copy --filename -'
    # Capture the all display outputs combined.
    Shift+Print exec '"$cmd_screenshot" aa - | satty --copy-command wl-copy --filename -'
    # Capture focused window.
    Alt+Print exec '"$cmd_screenshot" aw - | satty --copy-command wl-copy --filename -'
    # Capture a selected rectangular region.
    Ctrl+Print exec '"$cmd_screenshot" ig - | satty --copy-command wl-copy --filename -'
}

# vim:ft=swayconfig
