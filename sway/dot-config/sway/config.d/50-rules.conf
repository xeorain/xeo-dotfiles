# Window rules for Sway.
#
# Copyright (c) 2026 Jerry Xeo

# NOTE: `class`, `title`, `window_role`, `window_type` are all X11 window
# properties used specifically for XWayland applications.

# Generated windows
for_window [title="(?:Open|Save) (?:File|Folder|As)"] floating enable, resize set 800 600
for_window [window_role="pop-up"] floating enable
for_window [window_role="bubble"] floating enable
for_window [window_role="task_dialog"] floating enable
for_window [window_role="Preferences"] floating enable
for_window [window_type="dialog"] floating enable
for_window [window_type="menu"] floating enable
for_window [window_type="popup_menu"] floating enable

# Custom floating terminal window (using custom app_id)
for_window [app_id="_floating_term"] floating enable, \
  resize set width 800 px, resize set height 600 px, border pixel 2, \
  move container to workspace current

for_window [app_id="lxqt-policykit-agent"] floating enable, move position center
for_window [app_id="org.fcitx.fcitx5-config-qt"] floating enable, move position center
for_window [app_id="pavucontrol"] floating enable, move position center
for_window [app_id="pavucontrol-qt"] floating enable, move position center

for_window [app_id="com.gabm.satty"] floating enable
for_window [app_id="org.telegram.desktop"] floating enable
for_window [app_id="Throne"] floating enable

# Firefox screensharing indicator window
for_window [app_id="firefox" title="Firefox - Sharing Indicator"] floating enable
for_window [class="firefox" title="Firefox - Sharing Indicator"] floating enable

# vim:ft=swayconfig
