# Status bar configuration for Sway.
#
# Copyright (c) 2026 Jerry Xeo
#
# Requires:   i3status-rust

bar {
    status_command i3status-rs
    position top
    height 20
    workspace_min_width 18px
    # NOTE: Place 'Symbols Nerd Font' before 'Adwaita Sans' to let Nerd Font
    # glyphs take precedence for symbols, as they share some code points.
    font pango:Symbols Nerd Font, Adwaita Sans, Noto Sans, Font Awesome 7 Free, Font Awesome 7 Brands, Font Awesome 6 Free, Font Awesome 6 Brands, Noto Color Emoji, Noto Emoji 9
    tray_output none
    tray_padding 4
    separator_symbol "|"
    strip_workspace_numbers yes

    colors {
      background $color_bar_bg
      statusline $color_bar_fg
      separator $color_bar_sep
      # Workspac type    Border        BG            Text
      focused_workspace  $color5       $color5       $color_fg
      active_workspace   $color_bg     $color_bg     $color_fg
      inactive_workspace $color_bar_bg $color_bar_bg $color_bar_fg
      urgent_workspace   $color_bar_ug $color_bar_ug $color0
      binding_mode       $color_bar_fg $color5       $color_fg
    }
    bindsym button8 workspace next_on_output
    bindsym button9 workspace prev_on_output
}

# vim:ft=swayconfig
