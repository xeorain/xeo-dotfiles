#
# Basics:
#
## Launch // Terminal with the same directory as in last open terminal ##
# Requires:  See ~/.local/libexec/sway/swaycwd
$bindsym $mod+Ctrl+Return exec $term_cwd

## Launch // Scratchpad Picker ##
# Reuqires:   jq, rofi (>= 2.0) or rofi-wayland
$bindsym $mod+Ctrl+o exec swaymsg -t get_tree \
    | jq -r '.nodes[].nodes[] | select(.name? == "__i3_scratch").floating_nodes[] | "\(.id)\t\(.name)"' \
    | rofi -dmenu -p '[Scratchpad Picker] pick a scratchpad window' \
    | cut -f1 | xargs -I CON_ID swaymsg "[con_id=CON_ID]" focus

## Action // Show CapsLock indicator in notification ##
# Requires:   libnotify
$bindsym --release Caps_Lock exec "if grep -q 1 /sys/class/leds/input*::capslock/brightness; then \
    notify-send -r 195 -t 1100 -u low 'CapsLock '; else notify-send -r 195 -t 1100 -u low 'CapsLock '; fi"

## Action // Inhibit idle ##
# Requires:   xeo-inhibit-idle
$bindsym $mod+Alt+i exec 'xeo-inhibit-idle interactive && "$cmd_bar_signal" $bar $sig_idle'

## Action // Update all blocks in i3status-rs / Toggle visibility of waybar ##
$bindsym $mod+Shift+b exec $cmd_bar_usr1
## Action // Restart status bar in place ##
$bindsym $mod+Alt+b exec $cmd_bar_usr2

#
# Audio:
#
## Action // Adjust volume for audio sink ##
# Requires:     See ~/.local/libexec/xeo-utils-desktop/volume-helper
# Recommends:   libnotify
$bindsym --locked {
  $mod+equal exec "$cmd_volume" @DEFAULT_SINK@ 1%+
  $mod+minus exec "$cmd_volume" @DEFAULT_SINK@ 1%-
  $mod+Shift+equal exec "$cmd_volume" @DEFAULT_SINK@ 5%+
  $mod+Shift+minus exec "$cmd_volume" @DEFAULT_SINK@ 5%-
  $mod+backspace exec "$cmd_volume" @DEFAULT_SINK@ mute
  # Ditto, with XF86 keys
  XF86AudioRaiseVolume exec "$cmd_volume" @DEFAULT_SINK@ 1%+
  XF86AudioLowerVolume exec "$cmd_volume" @DEFAULT_SINK@ 1%-
  XF86AudioMute exec "$cmd_volume" @DEFAULT_SINK@ mute
}

## Action // Adjust volume for audio input ##
# Requires:     See ~/.local/libexec/xeo-utils-desktop/volume-helper
# Recommends:   libnotify
$bindsym --locked {
    $mod+Alt+equal exec "$cmd_volume" @DEFAULT_SOURCE@ 1%+
    $mod+Alt+minus exec "$cmd_volume" @DEFAULT_SOURCE@ 1%-
    $mod+Alt+Shift+equal exec "$cmd_volume" @DEFAULT_SOURCE@ 5%+
    $mod+Alt+Shift+minus exec "$cmd_volume" @DEFAULT_SOURCE@ 5%-
    $mod+Alt+backspace exec "$cmd_volume" @DEFAULT_SOURCE@ mute
    # Ditto, with XF86 keys
    $alt_mod+XF86AudioRaiseVolume exec "$cmd_volume" @DEFAULT_SOURCE@ 1%+
    $alt_mod+XF86AudioLowerVolume exec "$cmd_volume" @DEFAULT_SOURCE@ 1%-
    $alt_mod+XF86AudioMute exec "$cmd_volume" @DEFAULT_SOURCE@ mute
}

## Launch // audio profile switcher ##
# Requires:     See ~/.local/libexec/xeo-utils-desktop/audio-profile-switcher
# Recommends:   libnotify
$bindsym $mod+Ctrl+a exec "$cmd_audprof_switcher"

#
# Brightness:
#
## Action // Adjust display brightness ##
# Requires:     See ~/.local/libexec/xeo-utils-desktop/brightness-helper
# Recommends:   libnotify
$bindsym {
    $mod+bracketleft exec "$cmd_brightness" minus
    $mod+bracketright exec "$cmd_brightness" plus
    $mod+Shift+bracketleft exec "$cmd_brightness" minus10
    $mod+Shift+bracketright exec "$cmd_brightness" plus10
    $mod+Alt+bracketleft exec "$cmd_brightness" min
    $mod+Alt+bracketright exec "$cmd_brightness" max
    # Ditto, with XF86 keys
    XF86MonBrightnessDown exec "$cmd_brightness" minus
    XF86MonBrightnessUp exec "$cmd_brightness" plus
}

#
# Input method:
#
## Action // Switch input method ##
# Requires:     fcitx5, libnotify
bindsym $alt_mod+Ctrl+space exec fcitx5-remote -t \
    && IM="$(fcitx5-remote -n)" \
    && notify-send -e -u normal -t 800 -h "string:value:$IM" "$IM"

#
# Notification:
#
## Action // Manage dunst notifictions ##
# Requires:   dunst
$bindsym $mod+n exec dunstctl history-pop
$bindsym $mod+Shift+n exec dunstctl close
$bindsym $mod+Ctrl+Shift+n exec dunstctl close-all

# vim:ft=swayconfig
