## Action // Control music player (MPD) via mpc ##
# Requires:   mpd, mpc
$bindsym --locked {
    $mod+Ctrl+space exec 'mpc toggle'
    $mod+Ctrl+Shift+space exec 'mpc stop'
    $mod+Ctrl+n exec 'mpc next'
    $mod+Ctrl+p exec 'mpc prev'
    # Ditto, with XF86 keys
    XF86AudioPlay exec 'mpc toggle'
    XF86AudioStop exec 'mpc stop'
    XF86AudioNext exec 'mpc next'
    XF86AudioPrev exec 'mpc prev'
}
