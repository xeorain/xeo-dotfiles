# Binding mode for launching utilities.
#
# Copyright (c) 2026 Jerry Xeo

set $mode_utils '<span fallback="true">󱁤</span>  \
[<b>d</b>]isk \
[<b>m</b>]ixer'

mode --pango_markup $mode_utils {
    ## Launch // xeo-udiskie-rofi ##
    # Requires:   xeo-udiskie-rofi (see it for more deps)
    $bindsym d mode default, exec xeo-udiskie-rofi
    ## Launch // audio mixier ##
    # Requires:   wiremix
    $bindsym m mode default, exec $term_float wiremix

    $bindsym Escape mode default
    $bindsym Return mode default
    $bindsym $mod+Shift+u mode default
}

## Launch // Utils Mode ##
$bindsym $mod+Shift+u mode $mode_utils

