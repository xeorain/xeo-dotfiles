# Autostart background applications.
#
# Copyright (c) 2026 Jerry Xeo
#
# Requires:   cliphist, fcitx5, foot, kanshi, swayidle, udiskie, wl-clipboard,
#             wob, autotiling-rs (https://github.com/ammgws/autotiling-rs),
#             wl-clip-persist (https://github.com/Linus789/wl-clip-persist),
#             ~/.config/system/user/udiskie.service,
#             ~/.local/libexec/xeo-utils-desktop/clipboard-watcher,
#             ~/.local/libexec/xeo-utils-desktop/mpd-watcher,
#             ~/.local/libexec/xeo-utils-desktop/wobd

set $cmd_clipboard_watcher $libexec_desktop/clipboard-watcher
set $cmd_wobd              $libexec_desktop/wobd

exec {
    systemctl --user start foot-server.socket
    # Start udiskie for removable disk auto-mounting.
    systemctl --user start udiskie.service
}

# Applications not managed by systemd could crash, be killed accidentally, or
# need to restart for their new configurations to take effect. `exec_always` is
# used to ensure they can be safely recovered or updated on each in-place Sway
# configuration reload rather than having to restart Sway.
#
# `pgrep` is used as a guard to prevent multiple instances upon Sway
# configuration reloads. If you do need to restart a background application,
# kill it manually before applying the Sway configuration reload.
exec_always {
    # Start or reload kanshi.
    'if systemctl --user is-active kanshi.service; then kanshictl reload; else systemctl --user start kanshi.service; fi'

    # See ~/.config/swayidle/config for swayidle configuration.
    pgrep --quiet -xu "${EUID:-$(id -u)}" swayidle || swayidle

    # Start wob daemon.
    systemctl --user is-active sway-wobd \
        || systemd-run --user --unit=sway-wobd "$cmd_wobd"

    # Start clipboard watcher.
    systemctl --user -is-active sway-clipboard-watcher \
        || systemd-run --user --unit=sway-clipboard-watcher "$cmd_clipboard_watcher" $cmd_bar_signal $bar $sig_cliphist

    # Make clipboard content persistent even after programs exit.
    pgrep --quiet -xu "${EUID:-$(id -u)}" wl-clip-persist \
        || wl-clip-persist --clipboard regular --all-mime-type-regix '(?i)^(?!image/x-inkscape-svg).+'

    # Enable bspwm style auto-tiling on some workspaces.
    pgrep --quiet -xU "${EUID:-$(id -u)}" autotiling-rs || autotiling-rs -w 1 3 6

    # Start fcitx5 with logging disabled.
    pgrep --quiet  -xU "${EUID:-$(id -u)}" fcitx5 || fcitx5 -r --verbose '*=0'
}

# vim:ft=swayconfig
