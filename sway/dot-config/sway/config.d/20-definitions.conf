# Flags
set $wipe_cliphist_on_logout 1

# Status bar and signals
set $bar i3status-rs
set $sig_scratchpad 1
set $sig_idle 2
set $sig_cliphist 3
set $sig_music 4
set $sig_screenrec 5
set $sig_audiorec 6

# libexec directory for xeo desktop utils
set $libexec_desktop ${HOME}/.local/libexec/xeo-utils-desktop
# Sway libexec directory for Sway utils
set $libexec_sway ${HOME}/.local/libexec/sway

# Helper scripts
set $cmd_audprof_switcher  $libexec_desktop/audio-profile-switcher
set $cmd_bar_signal        $libexec_desktop/bar-signal
set $cmd_brightness        $libexec_desktop/brightness-helper
set $cmd_volume            $libexec_desktop/volume-helper

# Command for launching a new terminal emulator with the same directory as in
# last open terminal window.
set $term_cwd $term -D "$("$libexec_sway/swaycwd" 2>/dev/null || printf '%s' "${HOME}")"

# Command for toggling/updating status bar, which toggles waybar visibility;
# updates all blocks in i3status-rs.
set $cmd_bar_usr1 pkill -u "${EUID:-$(id -u)}" -x -SIGUSR1 $bar
# Command for restarting/reloading status bar, which reloads config for waybar;
# restarts i3status-rs.
set $cmd_bar_usr2 pkill -u "${EUID:-$(id -u)}" -x -SIGUSR2 $bar

# vim:ft=swayconfig
