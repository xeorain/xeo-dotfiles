# Binding mode for mimicking a system power menu.
#
# Copyright (c) 2026 Jerry Xeo
#
# Requires:   cliphist, swaylock

set $cmd_wipe_cliphist [ $wipe_cliphist_on_logout = 1 ] \
  && cliphist wipe || exit 0

set $mode_power '<span fallback="true"></span>  \
[<b>l</b>]ock \
[<b>e</b>]xit (logout) \
[<b>r</b>]eboot \
[<b>s</b>]uspend \
[<b>S</b>]hutdown'

mode --pango_markup $mode_power {
    ## Action // Lock the screen ##
    $bindsym l mode default, exec swaylock
    ## Action // Log out (exit sway) ##
    $bindsym e exec '$cmd_wipe_cliphist; swaymsg exit'
    ## Action // Reboot ##
    $bindsym r exec '$cmd_wipe_cliphist; systemctl reboot'
    ## Action // Sleep (suspend) ##
    $bindsym s mode default, exec systemctl sleep
    ## Action // Poweroff ##
    $bindsym Shift+s exec '$cmd_wipe_cliphist; systemctl poweroff'

    $bindsym Escape mode default
    $bindsym Return mode default
    $bindsym $mod+Shift+e mode default
}

## Launch // System Menu Mode ##
$bindsym $mod+Shift+e mode $mode_power

# vim:ft=swayconfig
