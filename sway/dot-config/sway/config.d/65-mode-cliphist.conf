# Binding mode for clipboard history.
#
# Copyright (c) 2026 Jerry Xeo
#
# Requires:   ~/.local/libexec/xeo-utils-desktop/cliphist-helper (see it for more deps),
#             ~/.local/libexec/xeo-utils-desktop/bar-signal

set $cmd_cliphist_helper $libexec_desktop/cliphist-helper
set $mode_cliphist '<span fallback="true">󰨸</span>  [<b>c</b>]opy [<b>d</b>]elete [<b>w</b>]ipe'

mode --pango_markup $mode_cliphist {
    $bindsym c exec '"$cmd_cliphist_helper" copy ', mode default
    $bindsym d exec '"$cmd_cliphist_helper" delete \
        && "$cmd_bar_signal" $bar $sig_cliphist', mode default
    $bindsym w exec '"$cmd_cliphist_helper" wipe \
        && "$cmd_bar_signal" $bar $sig_cliphist', mode default

    $bindsym Escape mode default
    $bindsym Return mode default
    $bindsym $mod+Shift+c mode default
}

## Launch // Cliphist Mode ##
$bindsym $mod+Shift+c mode $mode_cliphist

## Launch // Launch cliphist helper to pick ##
$bindsym $mod+c exec '"$cmd_cliphist_helper" copy'

# vim:ft=swayconfig
