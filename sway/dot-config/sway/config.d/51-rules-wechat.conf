# Window rules for WeChat.
#
# Copyright (c) 2026 Jerry Xeo

# WeChat for Linux is a Qt5-based application that has to be running via
# XWayland in Sway.
for_window [class="wechat" window_type="normal"] floating enable

# HACK: Fix a bug where WeChat Moments popup window (e.g., the "Like/Comment"
# bubble) disappears instantly upon clikcing.
# When clicking the two-dot button next to a Moments post, WeChat spawns a
# utility window allowing you to "Like" or "Comment", and then Sway
# immediately shifts focus to this utility window. WeChat for Linux bundles its
# own Qt5 libraries that must run through XWayland, which is sensitive to
# XWayland focus events during the window mapping phase. The focus shift causes
# the internal Qt state to glitch and close the window instantly. Sway's
# `no_focus` command prevens the focus shift from being applied to the WeChat
# utility window so that the utility window can exist without Sway intervention
# in its initial focus state.
no_focus [class="wechat" window_type="utility"]
