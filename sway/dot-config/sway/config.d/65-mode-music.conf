# Binding mode for toggling MPD and MPRIS services.
#
# Copyright (c) 2026 Jerry Xeo
#
# Requires:     mpd, mpc, mpdris2-rs (https://github.com/szclsya/mpdris2-rs), ncmpcpp
#               ~/.config/systemd/user/mpdris2-rs.service,
#               ~/.local/libexec/xeo-utils-desktop/mpdris-toggler (see it for more deps)

set $cmd_mpdris $libexec_desktop/mpdris-toggler
set $mode_music '<span fallback="true">󰝚</span>  [<b>s</b>]tart [<b>k</b>]kill [<b>p</b>]layer'

mode --pango_markup $mode_music {
    ## Launch // mpd and mpdris2 service ##
    $bindsym s mode default, exec "$cmd_mpdris" start
    ## Action // Stop mpdris2-rs and mpd ##
    $bindsym k mode default, exec 'mpc stop >/dev/null 2>&1; "$cmd_mpdris" stop'
    ## Launch // Start ncmpcpp ##
    $bindsym p mode default, exec $term_float ncmpcpp

    $bindsym Escape mode default
    $bindsym Return mode default
    $bindsym $mod+Shift+m mode default
}

## Launch // Music Mode ##
$bindsym $mod+Shift+m mode $mode_music

# vim:ft=swayconfig
