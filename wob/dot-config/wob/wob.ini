# User configuration for wob
#
# See `man 5 wob.ini` for a complete reference.
#
# Color references:
#             Border   Bar
#   red:      #b14242  #dc6868
#   green:    #427b58  #8ec07c
#   blue:     #365f9f  #78a6e6
#   magenta:  #944a76  #d184ad
#   yellow:   #c49a45  #e0b35a
#
# Copyright (c) 2026 Jerry Xeo

timeout = 3300
max = 100

width = 300
height = 8
border_offset = 0
border_size = 2
bar_padding = 0

anchor = top right
margin = 4 10 0 0

overflow_mode = wrap

[style.volume]
background_color = 13161e
bar_color = 8ec07c
border_color = 427b58
overflow_bar_color = dc6868
overflow_border_color = b14242
overflow_background_color = 13161e

[style.muted]
background_color = 13161e
bar_color = e0b35a
border_color = c49a45

[style.brightness]
background_color = 13161e
bar_color = 78a6e6
border_color = 365f9f

# vim:ft=confini
