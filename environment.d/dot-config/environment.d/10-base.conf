# Common environment variables for systemd --user.
#
# NOTE:
# * Environment variables automatically generated by a login session should not
#   be statically defined here, e.g., 'XDG_RUNTIME_DIR'.
# * Shell command substitution is not supported in systemd environment files,
#   so variable definitions like VAR="$(command)" do not work.
#
# Copyright (c) 2026 Jerry Xeo

XDG_CACHE_HOME="${HOME}/.cache"
XDG_CONFIG_HOME="${HOME}/.config"
XDG_DATA_HOME="${HOME}/.local/share"
XDG_STATE_HOME="${HOME}/.local/state"

GTK2_RC_FILES="${XDG_CONFIG_HOME}/gtk-2.0/gtkrc"
