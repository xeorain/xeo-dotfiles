# Application-specific environment variables for systemd --user.
#
# NOTE:
# * Environment variables automatically generated by a login session should not
#   be statically defined here, e.g., 'XDG_RUNTIME_DIR'.
# * Shell command substitution is not supported in systemd environment files,
#   so variable definitions like VAR="$(command)" do not work.
#
# Copyright (c) 2026 Jerry Xeo

### ssh-agent
SSH_AUTH_SOCK="${XDG_RUNTIME_DIR}/ssh-agent.socket"

### grim
#
# Default directory for grim to save screenshots
GRIM_DEFAULT_DIR="${XDG_PICTURES_DIR:-${HOME}/Pictures/Screenshots}"

### ncmpcpp
#
# Set `MPD_HOST` here as ncmpcpp doesn't allow parameter expansions in its own
# configuration file. The value assigned must be the same as the value of the
# `bind_to_address` key in MPD's config (~/.config/mpd/mpd.conf).
MPD_HOST="${XDG_RUNTIME_DIR}/mpd/socket"
