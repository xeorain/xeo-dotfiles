# User configuration for Ghostty on Linux.
#
# Copyright (c) 2026 Jerry Xeo

# --- Fonts ----------------------------------------------------------------{{{
# Aporetic (https://github.com/apkd/aporetic)
font-family = "Aporetic Sans Mono Medium"

# Font size (in pt).
# A proper font size depends on the fonts and the monitor specification, so
# adjust it accordingly.
# 14pt used for MacBook Air 13-inch display (227 DPI).
font-size = 9

# Thicken fonts (espeiclaly useful for a light background theme); comment out
# below if the font in use looks good.
font-thicken = true
# Fine-tune font thickness.
font-thicken-strength = 0
# }}}

# --- Key bindings ---------------------------------------------------------{{{
# Reload configuration file.
# The default binding on Linux is ctrl+shift+comma, which is now rebound to move
# tabs. Use ctrl+shift+f5 to be consistent with kitty.
keybind = ctrl+shift+f5=reload_config

# Launch theme manager and apply a new theme. (press fn+f9 to produce F9 on MacBook)
# NOTE: This binding has a flaw due to a limitation of Ghostty. The text: action
# is the only way to execute an external command from a Ghostty key binding.
# However, it works by injecting the command into the current shell for
# execution, so you will see the full command specified by `text:` printed in
# the terminal whenever the shortcut is pressed.
keybind = ctrl+shift+f9=text:ghostty +list-themes && kill -SIGUSR2 $(ps -p "$PPID" -o ppid=)\r

## Layout
# Split the window to the bottom.
keybind = ctrl+shift+minus=new_split:down
# Split the window to the right.
keybind = ctrl+shift+backslash=new_split:right
# Maximize the split window.
keybind = ctrl+shift+z=toggle_split_zoom

## Tab
# Add ctrl+alt+w to close a tab.
keybind = ctrl+alt+w=close_tab
keybind = ctrl+shift+left_bracket=previous_tab
keybind = ctrl+shift+right_bracket=next_tab
keybind = ctrl+shift+comma=move_tab:-1
keybind = ctrl+shift+period=move_tab:1

## Window
# Close a window (already default).
#keybind = ctrl+shift+w=close_surface
keybind = ctrl+alt+left=goto_split:left
keybind = ctrl+alt+right=goto_split:right
keybind = ctrl+alt+up=goto_split:up
keybind = ctrl+alt+down=goto_split:down

# Scrolling
keybind = ctrl+shift+up=scroll_page_lines:-1
keybind = ctrl+shift+down=scroll_page_lines:1
keybind = ctrl+shift+page_up=scroll_page_up
keybind = ctrl+shift+page_down=scroll_page_down
keybind = ctrl+shift+home=scroll_to_top
keybind = ctrl+shift+end=scroll_to_bottom
# Scroll half page.
keybind = alt+shift+page_up=scroll_page_fractional:-0.5
keybind = alt+shift+page_down=scroll_page_fractional:0.5
# Jump to previous/next prompt, the default ctrl+shift+page_up and
# ctrl+shift+page_down are remapped to do scroll page up and down.
keybind = alt+shift+up=jump_to_prompt:-1
keybind = alt+shift+down=jump_to_prompt:1

# Open the scrollback history in a text editor.
# INFO: `write_scrollback_file:open` writes the scrollback history to a
# temporary file, and then executes the macOS `open` command to open the
# temporary file with the system default corresponding application. Ghostty
# doesn't provide an option that allows specifying a pager, nor respects the
# PAGER environment variable. Therefore, unless macOS is specifically
# configured, we cannot simply use it to open the terminal scrollback history in
# a preferred pager. Fortunately, we can use Ghostty's advanced macro chaining
# feature as a workaround.
# See https://github.com/ghostty-org/ghostty/issues/2504
#
# The following binding combination is equivalent to executing:
#
#     nvim -c 'lua require("util").colorize()' <scrollback-tmpfile>
#
# The `\x20` is the hex escape representing a space.
#
#
# NOTE: Using `nvim` as a pager requires my personal Neovim configurtaion.
keybind = ctrl+shift+s=text:nvim -c 'lua require("util").colorize()'\x20
keybind = chain=write_scrollback_file:paste,plain
keybind = chain=text:\r
#keybind = ctrl+shift+s=write_scrollback_file:open

# Zooming (default)
#keybind = ctrl+minus=decrease_font_size:1
#keybind = ctrl+equal=increase_font_size:1
#keybind = ctrl+shift+equal=increase_font_size:1
#keybind = ctrl+0=reset_font_size:1
# Support NumLock keys.
keybind = ctrl+kp_subtract=decrease_font_size:1
keybind = ctrl+kp_add=increase_font_size:1

# Search mode
# Use command+shift+/ instead of the default ctrl+shift+f to start search.
keybind = ctrl+shift+f=unbind
keybind = ctrl+shift+slash=start_search

## URL handling
# Copy the URL under the cursor to clipboard.
# FIXME: Doesn't seem to work!
keybind = performable:ctrl+shift+y=copy_url_to_clipboard
# }}}

# --- Theme ----------------------------------------------------------------{{{
# Load theme configuration file automatically generated by Ghostty theme manager
# (a.k.a auto theme file).
config-file = ?auto/theme.ghostty
# }}}

