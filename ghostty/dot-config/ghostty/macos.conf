#
# Copyright (c) 2026 Jerry Xeo

# --- Fonts ----------------------------------------------------------------{{{
# Iosevka Term SS08 (favored on MacBook Air because of its slanderness)
font-family = "Iosevka Term SS08 Medium"

# Font size (in pt).
# A proper font size depends on the fonts and the monitor specification, so
# adjust it accordingly.
# 14pt used for MacBook Air 13-inch display (227 DPI).
font-size = 14

# Thicken fonts (especially useful for a light background theme); comment out
# below if the font in use looks good.
#font-thicken = true
# Fine-tune font thickness.
font-thicken-strength = 0
# }}}

# --- Key bindings ---------------------------------------------------------{{{
# Use the 'option' key as Alt key on macOS.
macos-option-as-alt = true

# Reload configuration file (press fn+f5 to produce F5 on MacBook)
# The default binding command+shift+comma is now remapped to move tabs.
keybind = command+shift+f5=reload_config

# Launch theme manager and apply a new theme. (press fn+f9 to produce F9 on MacBook)
# NOTE: This binding has a flaw due to a limitation of Ghostty. The text: action
# is the only way to execute an external command from a Ghostty key binding.
# However, it works by injecting the command into the current shell for
# execution, so you will see the full command specified by `text:` printed in
# the terminal whenever the shortcut is pressed.
keybind = command+shift+f9=text:ghostty +list-themes && kill -SIGUSR2 $(ps -p "$PPID" -o ppid=)\r

## Layout
# Split the window to the bottom.
keybind = command+shift+minus=new_split:down
# Split the window to the right.
keybind = command+shift+backslash=new_split:right
# Maximize the split window.
keybind = command+shift+z=toggle_split_zoom

## Tab
#keybind = command+alt+w=close_tab
#keybind = command+shift+left_bracket=previous_tab
#keybind = command+shift+right_bracket=next_tab
keybind = command+shift+comma=move_tab:-1
keybind = command+shift+period=move_tab:1

## Window (already default)
#keybind = command+w
#keybind = command+alt+left=goto_split:left
#keybind = command+alt+right=goto_split:right
#keybind = command+alt+up=goto_split:up
#keybind = command+alt+down=goto_split:down

# Scrolling
keybind = command+shift+up=scroll_page_lines:-1
keybind = command+shift+down=scroll_page_lines:1
keybind = command+shift+page_up=scroll_page_up
keybind = command+shift+page_down=scroll_page_down
keybind = command+shift+home=scroll_to_top
keybind = command+shift+end=scroll_to_bottom
# half-page scrolling
keybind = alt+page_up=scroll_page_fractional:-0.5
keybind = alt+page_down=scroll_page_fractional:0.5
# Jump to previous/next prompt (already default)
#keybind = cmd+up=jump_to_prompt:-1
#keybind = cmd+down=jump_to_prompt:1

# Open the scrollback history in a text editor.
# INFO: `write_scrollback_file:open` writes the scrollback history to a
# temporary file, and then executes the macOS `open` command to open the
# temporary file with the system default corresponding application. Ghostty
# doesn't provide an option that allows specifying a pager, nor respects the
# PAGER environment variable. Therefore, unless macOS is specifically
# configured, we cannot simply use it to open the terminal scrollback history in
# a preferred pager. Fortunately, we can use Ghostty's advanced macro chaining
# feature as a workaround.
# See https://github.com/ghostty-org/ghostty/issues/2504
#
# The following binding combination is equivalent to executing:
#
#     nvim -c 'lua require("util").colorize()' <scrollback-tmpfile>
#
# The `\x20` is the hex escape representing a space.
#
# NOTE: Using `nvim` as a pager requires my personal Neovim configurtaion.
keybind = command+shift+s=text:nvim -c 'lua require("util").colorize()'\x20
keybind = chain=write_scrollback_file:paste,plain
keybind = chain=text:\r
#keybind = ctrl+shift+s=write_scrollback_file:open

# Zooming (default)
#keybind = command+minus=decrease_font_size:1
#keybind = command+equal=increase_font_size:1
#keybind = command+shift+equal=increase_font_size:1
#keybind = command+0=reset_font_size:1
# Support NumLock keys.
keybind = command+kp_subtract=decrease_font_size:1
keybind = command+shift+kp_add=increase_font_size:1

# Search mode
# Use command+shift+/ instead of the default command+f to start search.
keybind = command+f=unbind
keybind = command+shift+slash=start_search

## URL handling
# Copy the URL under the cursor to clipboard.
# FIXME: Doesn't seem to work!
keybind = performable:command+shift+y=copy_url_to_clipboard
# }}}

# --- Theme ----------------------------------------------------------------{{{
# Load theme configuration file automatically generated by Ghostty theme manager
# (a.k.a auto theme file).
# INFO: On macOS, ~/Library/Application Support/com.mitchellh.ghostty is the
# standard configuration directory where the theme manager dumps the auto theme
# file. However, since the main user configuration file stowed by GNU `stow` is
# in ~/.config/ghostty, we have to specify the absolute path of the auto theme
# file rather than the relative path `?auto/theme.ghostty` as mentioned in the
# theme manager.
config-file = ?"~/Library/Application Support/com.mitchellh.ghostty/auto/theme.ghostty"
# }}}

